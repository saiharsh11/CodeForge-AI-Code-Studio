<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Illustration: the model claims O(n); timing the code in the browser shows it grows like O(n squared), so the claim is flagged.">
  <title>Big-O check (illustration)</title>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .in, .pop, .draw { animation: 12s ease-out infinite both; }
    .in   { animation-name: in; }
    .pop  { animation-name: pop; transform-box: fill-box; transform-origin: center; }
    .draw { animation-name: draw; stroke-dasharray: 600; }
    /* every element: appears at its own delay, stays, then the whole scene fades out and loops */
    @keyframes in   { 0% { opacity: 0; transform: translateY(8px); } 6%, 84% { opacity: 1; transform: none; } 92%, 100% { opacity: 0; } }
    @keyframes pop  { 0% { opacity: 0; transform: scale(.2); } 4%, 84% { opacity: 1; transform: none; } 92%, 100% { opacity: 0; } }
    @keyframes draw { 0% { stroke-dashoffset: 600; opacity: 1; } 10%, 84% { stroke-dashoffset: 0; opacity: 1; } 92%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1280" height="440" rx="20" fill="#0f1216"/>
  <rect x=".5" y=".5" width="1279" height="439" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <!-- header -->
  <text x="40" y="48" font-size="12" font-weight="700" letter-spacing="2.4" fill="#79b8e4">BIG-O · CLAIMED VS MEASURED</text>
  <text x="1240" y="48" text-anchor="end" font-size="12" fill="#fff" fill-opacity=".35">illustration of the check — timing runs in your browser</text>
  <line x1="40" y1="70" x2="1240" y2="70" stroke="#fff" stroke-opacity=".07"/>

  <!-- 1. your code + the model's claim -->
  <text x="40" y="104" font-size="11" font-weight="700" letter-spacing="1.8" fill="#fff" fill-opacity=".35">1 · YOUR CODE</text>
  <rect x="40" y="118" width="380" height="196" rx="12" fill="#000" fill-opacity=".28"/>
  <g transform="translate(60 150)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#c9d4dc">def <tspan fill="#72b5e4">dedupe</tspan>(items):</text>
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#c9d4dc">    seen, out = [], []<tspan fill="#72b5e4"></tspan></text>
      <text x="0" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#c9d4dc">    for <tspan fill="#72b5e4">x</tspan> in items:</text>
      <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#c9d4dc">        if <tspan fill="#72b5e4">x</tspan> not in seen:</text>
      <text x="0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#c9d4dc">            seen.append(x)<tspan fill="#72b5e4"></tspan></text>
      <text x="0" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#c9d4dc">            out.append(x)<tspan fill="#72b5e4"></tspan></text>
      <text x="0" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#c9d4dc">    return <tspan fill="#72b5e4">out</tspan></text>
  </g>
  <g class="in" style="animation-delay:0.8s">
    <rect x="40" y="330" width="380" height="54" rx="12" fill="#d95926" fill-opacity=".12" stroke="#d95926" stroke-opacity=".45"/>
    <text x="60" y="352" font-size="11" font-weight="700" letter-spacing="1.6" fill="#d95926">THE MODEL SAYS</text>
    <text x="60" y="373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#f3b79c">Claim: O(n)<tspan class="cursor"> ▍</tspan></text>
  </g>

  <!-- 2. the browser times it -->
  <text x="470" y="104" font-size="11" font-weight="700" letter-spacing="1.8" fill="#fff" fill-opacity=".35">2 · YOUR BROWSER TIMES IT</text>
  <g class="in" style="animation-delay:1.6s">
    <line x1="470" y1="342" x2="800" y2="342" stroke="#fff" stroke-opacity=".15"/>
    <line x1="470" y1="342" x2="470" y2="122" stroke="#fff" stroke-opacity=".15"/>
    <line x1="470" y1="287" x2="800" y2="287" stroke="#fff" stroke-opacity=".05"/><line x1="470" y1="232" x2="800" y2="232" stroke="#fff" stroke-opacity=".05"/><line x1="470" y1="177" x2="800" y2="177" stroke="#fff" stroke-opacity=".05"/>
    <text x="496" y="364" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fff" fill-opacity=".35">1k</text><text x="552" y="364" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fff" fill-opacity=".35">2k</text><text x="608" y="364" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fff" fill-opacity=".35">4k</text><text x="664" y="364" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fff" fill-opacity=".35">8k</text><text x="720" y="364" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fff" fill-opacity=".35">16k</text><text x="776" y="364" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fff" fill-opacity=".35">32k</text>
    <text x="800" y="382" text-anchor="end" font-size="11" fill="#fff" fill-opacity=".35">input size n (log)</text>
    <text x="460" y="126" text-anchor="end" font-size="11" fill="#fff" fill-opacity=".35">time</text>
  </g>
  <line class="draw" style="animation-delay:4.6s" x1="496" y1="324" x2="776" y2="229" stroke="#d95926" stroke-width="2.5" stroke-linecap="round"/>
  <line class="draw" style="animation-delay:4.9s" x1="496" y1="324" x2="776" y2="134" stroke="#199e70" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="pop" style="animation-delay:2.20s" cx="496" cy="324" r="5.5" fill="#3987e5" stroke="#0f1216" stroke-width="2"/><circle class="pop" style="animation-delay:2.55s" cx="552" cy="286" r="5.5" fill="#3987e5" stroke="#0f1216" stroke-width="2"/><circle class="pop" style="animation-delay:2.90s" cx="608" cy="248" r="5.5" fill="#3987e5" stroke="#0f1216" stroke-width="2"/><circle class="pop" style="animation-delay:3.25s" cx="664" cy="214" r="5.5" fill="#3987e5" stroke="#0f1216" stroke-width="2"/><circle class="pop" style="animation-delay:3.60s" cx="720" cy="172" r="5.5" fill="#3987e5" stroke="#0f1216" stroke-width="2"/><circle class="pop" style="animation-delay:3.95s" cx="776" cy="134" r="5.5" fill="#3987e5" stroke="#0f1216" stroke-width="2"/>
  <g class="in" style="animation-delay:5.4s" font-size="12">
    <rect x="482" y="120" width="10" height="3" rx="1.5" fill="#3987e5"/><text x="498" y="125" fill="#c9d4dc">Measured</text>
    <rect x="576" y="120" width="10" height="3" rx="1.5" fill="#199e70"/><text x="592" y="125" fill="#c9d4dc">Best fit O(n²)</text>
    <rect x="698" y="120" width="10" height="3" rx="1.5" fill="#d95926"/><text x="714" y="125" fill="#c9d4dc">Claimed O(n)</text>
  </g>

  <!-- 3. verdict -->
  <text x="870" y="104" font-size="11" font-weight="700" letter-spacing="1.8" fill="#fff" fill-opacity=".35">3 · THE VERDICT</text>
  <g class="in" style="animation-delay:6.2s">
    <rect x="870" y="118" width="370" height="44" rx="22" fill="#f08c7c" fill-opacity=".15"/>
    <text x="894" y="146" font-size="15" font-weight="700" fill="#f5b3a8">✗  Doesn’t match the measurements</text>
  </g>
  <g class="in" style="animation-delay:6.8s">
    <text x="872" y="196" font-size="14" fill="#fff" fill-opacity=".7">The model claimed O(n), but the</text>
    <text x="872" y="218" font-size="14" fill="#fff" fill-opacity=".7">measurements grow like O(n²).</text>
  </g>
  <g class="in" style="animation-delay:7.4s" font-size="13">
    
    <text x="872" y="262" fill="#fff" fill-opacity=".4">Claimed</text>
    <text x="1240" y="262" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f3b79c">O(n)</text>
    <line x1="872" y1="274" x2="1240" y2="274" stroke="#fff" stroke-opacity=".06"/>
    <text x="872" y="294" fill="#fff" fill-opacity=".4">Measured</text>
    <text x="1240" y="294" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9bd6b0">O(n²)</text>
    <line x1="872" y1="306" x2="1240" y2="306" stroke="#fff" stroke-opacity=".06"/>
    <text x="872" y="326" fill="#fff" fill-opacity=".4">Log-log slope</text>
    <text x="1240" y="326" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#c9d4dc">1.97</text>
    <line x1="872" y1="338" x2="1240" y2="338" stroke="#fff" stroke-opacity=".06"/>
  </g>
  <g class="in" style="animation-delay:8.1s">
    <text x="872" y="373" font-size="13" fill="#79b8e4">Why: <tspan fill="#fff" fill-opacity=".6">“x not in seen” scans a list each time.</tspan></text>
  </g>
</svg>
